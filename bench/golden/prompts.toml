# Prompts for `vt-bench record`: the personal golden set.
#
# Read each one naturally, the way you'd dictate it. The text is the reference
# transcript, written the way you'd want it to appear, so punctuation and
# casing count towards the P&C score.
# Tags let results be sliced: slack, email, ai-chat, names, numbers, question,
# long, fast, short.
# Don't renumber ids: recordings are matched to prompts by id.

[[prompt]]
id = "p01"
tags = ["slack", "short"]
text = "Sounds good, I'll take a look this afternoon."

[[prompt]]
id = "p02"
tags = ["slack", "question"]
text = "Did anyone get a chance to review the pull request from yesterday?"

[[prompt]]
id = "p03"
tags = ["slack"]
text = "Quick update: the build is green again, so we can go ahead with the release."

[[prompt]]
id = "p04"
tags = ["slack", "names"]
text = "Thanks Priya, can you loop in Arjun and Kavya before the standup?"

[[prompt]]
id = "p05"
tags = ["slack", "short"]
text = "Running ten minutes late, start without me."

[[prompt]]
id = "p06"
tags = ["slack", "names"]
text = "The GetBanaya storefront is live, please share it with your sellers."

[[prompt]]
id = "p07"
tags = ["slack", "question"]
text = "Should we move the demo to Thursday or keep it on Friday?"

[[prompt]]
id = "p08"
tags = ["slack", "fast"]
text = "I think the bug is in the checkout flow because the coupon is applied twice when you refresh the page."

[[prompt]]
id = "p09"
