# Windows/MSVC: link the C runtime statically (/MT) everywhere.
#
# sherpa-onnx's prebuilt static libraries are compiled with /MT, so every other
# native library (whisper.cpp via whisper-rs-sys, later llama.cpp) must use /MT
# too, or the link fails with LNK2038 "RuntimeLibrary mismatch". cmake-rs and cc
# pick this flag up automatically. Side benefit: vt-bench.exe and the app need
# no Visual C++ redistributable on the user's machine.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ...and make CMake-built C/C++ deps honour /MT in *every* configuration.
# whisper-rs-sys builds the Release config but, in debug builds, tells cmake-rs
# the build type is RelWithDebInfo, so cmake-rs's /MT lands in the wrong flags
# variable and whisper.cpp falls back to CMake's default /MD. whisper-rs-sys
# forwards CMAKE_* env vars as -D defines; opting into policy CMP0091 makes
# CMAKE_MSVC_RUNTIME_LIBRARY authoritative. Non-MSVC compilers ignore both.
[env]
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

# ...and keep optimisation on. With MSVC, cmake-rs *replaces*
# CMAKE_<LANG>_FLAGS_RELEASE with the cc crate's flags but strips every -O flag
# ("let cmake deal with optimization"), which removes CMake's /O2: whisper.cpp
# then builds at /Od and runs ~30x slower than real time. Defining the variable
# ourselves (whisper-rs-sys forwards CMAKE_* env vars) makes cmake-rs leave it
# alone. Dash syntax works for MSVC cl, GCC and Clang alike.
CMAKE_C_FLAGS_RELEASE = "-O2 -DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "-O2 -DNDEBUG"

# Portable CPU baseline for the binaries we ship. ggml defaults to
# GGML_NATIVE=ON (-march=native / CI runner's CPU), which could emit AVX-512 and
# crash with "illegal instruction" on the user's laptop. OFF = SSE4.2, AVX, AVX2,
# BMI2, FMA, F16C (every x86-64 CPU since ~2013), AVX-512 off.
GGML_NATIVE = "OFF"
