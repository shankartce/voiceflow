[package]
name = "vt-bench"
description = "Developer CLI: fetch models, record a golden set, transcribe, and benchmark WER / latency / memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vt-bench"
path = "src/main.rs"

[features]
default = ["record"]
# Microphone capture for `record` and `mic-latency` (needs ALSA headers on Linux).
record = ["dep:cpal"]
sherpa-shared = ["vt-stt/sherpa-shared"]

[dependencies]
vt-models = { workspace = true, features = ["download"] }
vt-audio.workspace = true
vt-stt = { workspace = true, features = ["sherpa", "whisper"] }
vt-platform.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sysinfo.workspace = true
flate2.workspace = true
tar.workspace = true
claxon.workspace = true
hound.workspace = true
cpal = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
