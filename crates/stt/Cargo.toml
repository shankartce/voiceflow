[package]
name = "vt-stt"
description = "SpeechEngine trait and the Parakeet / Moonshine (sherpa-onnx) and Whisper (whisper.cpp) engines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["sherpa", "whisper"]
sherpa = ["dep:sherpa-onnx"]
whisper = ["dep:whisper-rs"]
# sherpa-onnx links statically by default (its build script downloads the
# upstream static libs). `sherpa-shared` links a .so/.dll from
# SHERPA_ONNX_LIB_DIR instead, for machines that can't reach GitHub releases.
sherpa-shared = ["sherpa-onnx?/shared"]

[dependencies]
thiserror.workspace = true
vt-models.workspace = true
sherpa-onnx = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

[lints]
workspace = true
