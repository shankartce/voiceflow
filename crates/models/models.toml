# Model manifest — compiled into the binary (vt-models). See docs/MODELS.md.
#
# Every downloadable file is pinned by `sha256` + `size`, and every Hugging Face
# source by an immutable commit `revision`. Entries with an empty revision or
# hash are "unlocked": `fetch` refuses them, and `vt-bench manifest lock` (run in
# CI, which can reach Hugging Face) prints the values to paste here.
#
# We never re-host weights: URLs point at the upstream publishers.

[[model]]
id = "parakeet-tdt-0.6b-v2-int8"
kind = "stt"
engine = "sherpa-nemo-transducer"
license = "CC-BY-4.0"
attribution = "NVIDIA Parakeet TDT 0.6B v2 (https://huggingface.co/nvidia/parakeet-tdt-0.6b-v2), int8 ONNX export by k2-fsa/sherpa-onnx"
approx_mb = 640
source = { hf_repo = "csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8", revision = "" }

  [[model.file]]
  name = "encoder.int8.onnx"
  role = "encoder"
  sha256 = ""
  size = 0

  [[model.file]]
  name = "decoder.int8.onnx"
  role = "decoder"
  sha256 = ""
  size = 0

  [[model.file]]
  name = "joiner.int8.onnx"
  role = "joiner"
  sha256 = ""
  size = 0

  [[model.file]]
  name = "tokens.txt"
  role = "tokens"
  sha256 = ""
  size = 0

