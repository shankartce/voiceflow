# Model manifest — compiled into the binary (vt-models). See docs/MODELS.md.
#
# Every downloadable file is pinned by `sha256` + `size`, and every Hugging Face
# source by an immutable commit `revision`. Entries with an empty revision or
# hash are "unlocked": `fetch` refuses them, and `vt-bench manifest lock` (run in
# CI, which can reach Hugging Face) prints the values to paste here.
#
# We never re-host weights: URLs point at the upstream publishers.

